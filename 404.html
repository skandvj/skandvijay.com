<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ScopeMind</title>
    <script>
      // GitHub Pages SPA fallback: redirect unknown paths to index with path preserved
      sessionStorage.setItem('gh-pages-redirect', location.pathname + location.search + location.hash);
      location.replace('/');
    </script>
  </head>

</html>
